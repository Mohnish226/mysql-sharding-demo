version: '3.8'

services:
  mysql-shard1:
    image: mariadb:${MARIADB_VERSION:-10.11}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-shard_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shard_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shard_db}
    ports:
      - "${SHARD1_PORT:-3307}:3306"
    volumes:
      - mysql-shard1-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  mysql-shard2:
    image: mariadb:${MARIADB_VERSION:-10.11}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-shard_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shard_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shard_db}
    ports:
      - "${SHARD2_PORT:-3308}:3306"
    volumes:
      - mysql-shard2-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  sharding-proxy:
    build: .
    ports:
      - "${PROXY_PORT:-8000}:8000"
    depends_on:
      mysql-shard1:
        condition: service_healthy
      mysql-shard2:
        condition: service_healthy
    environment:
      - SHARD1_URL=mysql+aiomysql://${MYSQL_USER:-shard_user}:${MYSQL_PASSWORD:-shard_password}@mysql-shard1:3306/${MYSQL_DATABASE:-shard_db}
      - SHARD2_URL=mysql+aiomysql://${MYSQL_USER:-shard_user}:${MYSQL_PASSWORD:-shard_password}@mysql-shard2:3306/${MYSQL_DATABASE:-shard_db}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      
volumes:
  mysql-shard1-data:
  mysql-shard2-data: